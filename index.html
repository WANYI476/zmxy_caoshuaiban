<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>造梦西游 · Web版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%;
    background:#05050f;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    display:block;
    background:#0a0a20;
    box-shadow:0 0 80px rgba(120,80,220,.5);
    border-radius:6px;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function(){
'use strict';

var W = 1000, H = 600;
var GROUND = 520;
var WORLD_W = 3400;
var GRAV = 0.9;
var JUMP_V = -17;
var MAX_FALL = 22;
var STEP = 1000 / 30;

var CHAR_WUKONG = 0, CHAR_SHA = 1, CHAR_BAJIE = 2;

var ST_TITLE=0, ST_CHARSEL=1, ST_STAGESEL=2, ST_PLAY=3,
    ST_BUFF=4, ST_STAGECLEAR=5, ST_OVER=6, ST_ALLWIN=7;

var STAGE_BASE = [0, 7, 28];
var STAGE_LEN  = [7, 21, 14];

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

function resize() {
    var scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

var keys = {}, keysPrev = {};
window.addEventListener('keydown', function(e){
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ keys = {}; });

function down(c){ return !!keys[c]; }
function edge(c){ return !!keys[c] && !keysPrev[c]; }
function anyDown(){ for (var i=0;i<arguments.length;i++) if (down(arguments[i])) return true; return false; }
function anyEdge(){ for (var i=0;i<arguments.length;i++) if (edge(arguments[i])) return true; return false; }

var state = ST_TITLE;
var frame = 0;
var level = 0;
var currentStage = 0;
var camX = 0;
var levelCleared = false;
var levelClearTimer = 0;
var dashId = 0;
var nextProjId = 0;

var player = null;
var enemies = [];
var projectiles = [];

var charSel = 0, stageSel = 0, selectedChar = CHAR_WUKONG;
var buffSel = 0, buffOptions = [], buffDelay = 0, screenDelay = 0;

var progress = {
    stageCleared: [false, false, false],
    maxUnlocked: 0,
    bonusHP: 0, bonusMP: 0, bonusATK: 0
};

function loadProgress(){
    try {
        var s = localStorage.getItem('dream_save');
        if (s) {
            var d = JSON.parse(s);
            if (d.stageCleared) progress.stageCleared = d.stageCleared;
            if (typeof d.maxUnlocked === 'number') progress.maxUnlocked = d.maxUnlocked;
            if (typeof d.bonusHP === 'number') progress.bonusHP = d.bonusHP;
            if (typeof d.bonusMP === 'number') progress.bonusMP = d.bonusMP;
            if (typeof d.bonusATK === 'number') progress.bonusATK = d.bonusATK;
        }
    } catch(e){}
}
function saveProgress(){
    try { localStorage.setItem('dream_save', JSON.stringify(progress)); } catch(e){}
}
loadProgress();

var BUFFS = [
    { id:'hp',     name:'铁骨',  desc:'最大生命 +25' },
    { id:'mp',     name:'灵韵',  desc:'最大法力 +25' },
    { id:'atk',    name:'蛮力',  desc:'攻击力 +6' },
    { id:'dmg',    name:'战意',  desc:'所有伤害 +20%' },
    { id:'spd',    name:'神行',  desc:'移动速度 +20%' },
    { id:'cd',     name:'疾风',  desc:'冷却缩减 20%' },
    { id:'regen',  name:'回春',  desc:'生命回复加速' },
    { id:'mpreg',  name:'聚气',  desc:'法力回复加速' },
    { id:'tough',  name:'坚韧',  desc:'受伤 -25%' },
    { id:'crit',   name:'锐眼',  desc:'暴击率 +25%' },
    { id:'life',   name:'吸血',  desc:'吸血 15%' },
    { id:'flame',  name:'烈焰',  desc:'投射物 +50%' },
    { id:'pierce', name:'穿透',  desc:'穿透 +1' },
    { id:'rapid',  name:'迅捷',  desc:'攻速 +25%' }
];

function createPlayer(){
    return {
        x:100, y:GROUND, vx:0, vy:0, kbvx:0,
        hp:100, maxhp:100, mp:100, maxmp:100,
        onGround:true, facing:1,
        charType:CHAR_WUKONG,
        atkAnim:0, atkCd:0, hurtTimer:0, skillCd:0,
        comboStep:0, comboTimer:0,
        dashTimer:0, dashVx:0, skillUCD:0,
        skillICD:0, skillIFlash:0,
        invulnTimer:0, score:0,
        chargeTimer:0, chargeFlash:0,
        buffCount:0, atkBonus:0,
        dmgMul:1, moveMul:1, cdMul:1,
        dmgReduce:1, projMul:1, atkSpdMul:1,
        critChance:0, lifesteal:0,
        hpRegen:0, mpRegen:0, pierceBonus:0
    };
}

function resetPlayerForStage(){
    player = createPlayer();
    player.maxhp = 100 + progress.bonusHP;
    player.hp = player.maxhp;
    player.maxmp = 100 + progress.bonusMP;
    player.mp = player.maxmp;
    player.atkBonus = progress.bonusATK;
    player.charType = selectedChar;
}

function applyBuff(id){
    switch(id){
        case 'hp': player.maxhp += 25; player.hp = Math.min(player.hp + 25, player.maxhp); break;
        case 'mp': player.maxmp += 25; player.mp = player.maxmp; break;
        case 'atk': player.atkBonus += 6; break;
        case 'dmg': player.dmgMul *= 1.2; break;
        case 'spd': player.moveMul = Math.min(player.moveMul * 1.2, 2); break;
        case 'cd':  player.cdMul = Math.max(player.cdMul * 0.8, 0.3); break;
        case 'regen':
            player.hpRegen = player.hpRegen === 0 ? 30 : Math.max(Math.floor(player.hpRegen * 2 / 3), 8);
            break;
        case 'mpreg':
            player.mpRegen = player.mpRegen === 0 ? 11 : Math.max(Math.floor(player.mpRegen * 2 / 3), 5);
            break;
        case 'tough': player.dmgReduce = Math.max(player.dmgReduce * 0.75, 0.25); break;
        case 'crit':  player.critChance = Math.min(player.critChance + 25, 100); break;
        case 'life':  player.lifesteal = Math.min(player.lifesteal + 15, 100); break;
        case 'flame': player.projMul *= 1.5; break;
        case 'pierce': player.pierceBonus += 1; break;
        case 'rapid': player.atkSpdMul = Math.max(player.atkSpdMul * 0.8, 0.35); break;
    }
    player.buffCount++;
}

var ENEMY_DEF = {
    0:{ hp:30,  dmg:5,  spd:1.2, color:'#5fdf5f', size:28, name:'小妖' },
    1:{ hp:70,  dmg:9,  spd:0.9, color:'#e05050', size:34, name:'牛头' },
    2:{ hp:280, dmg:14, spd:1.0, color:'#c060e0', size:52, name:'白骨精', boss:true },
    3:{ hp:360, dmg:16, spd:1.1, color:'#ff5020', size:52, name:'红孩儿', boss:true },
    4:{ hp:440, dmg:18, spd:1.0, color:'#30d0e0', size:54, name:'铁扇公主', boss:true },
    5:{ hp:580, dmg:22, spd:1.1, color:'#e040a0', size:60, name:'牛魔王', boss:true },
    6:{ hp:380, dmg:16, spd:1.1, color:'#ffd030', size:52, name:'金童子', boss:true },
    7:{ hp:380, dmg:16, spd:1.1, color:'#c0c0d0', size:52, name:'银童子', boss:true },
    8:{ hp:640, dmg:20, spd:1.0, color:'#9040e0', size:64, name:'镇元大仙', boss:true }
};

function spawnEnemy(type, x, scale){
    if (enemies.length >= 32) return;
    var d = ENEMY_DEF[type] || ENEMY_DEF[0];
    enemies.push({
        x:x, y:GROUND, vx:0,
        hp: Math.round(d.hp * scale),
        maxhp: Math.round(d.hp * scale),
        dmg: Math.round(d.dmg * scale),
        speed: d.spd,
        type:type, color:d.color, size:d.size,
        boss: !!d.boss,
        facing:-1, alive:true,
        atkAnim:0, atkCd:0, hurtTimer:0, stunTimer:0,
        lastDashHit:0, lastProjHit:0,
        barrageCd: 60 + Math.floor(Math.random()*40),
        barragePattern: 0,
        phase:0, phase2Triggered:false
    });
}

function spawnProj(x, y, vx, vy, dmg, owner, pierce, color, shape, opts){
    opts = opts || {};
    projectiles.push({
        x:x, y:y, vx:vx, vy:vy, dmg:dmg,
        owner:owner, pierce:pierce,
        color:color, shape:shape,
        life:200, id:++nextProjId,
        boomerang: !!opts.boomerang,
        returning:false,
        ox:x, oy:y,
        r: opts.r || 6
    });
}

function initLevel(lv){
    enemies = [];
    projectiles = [];
    level = lv;

    if (lv < STAGE_BASE[1]) currentStage = 0;
    else if (lv < STAGE_BASE[2]) currentStage = 1;
    else currentStage = 2;

    var pos = lv - STAGE_BASE[currentStage];
    var sc = 1 + lv * 0.08;
    var i, n;

    if (currentStage === 0){
        if (pos === 6){
            spawnEnemy(2, 700, 1);
            spawnEnemy(0, 500, sc);
            spawnEnemy(1, 850, sc);
        } else {
            n = Math.min(2 + Math.floor(lv/3), 5);
            for (i=0;i<n;i++) spawnEnemy(i%4===3?1:0, 500 + i*160, sc);
        }
    } else if (currentStage === 1){
        if (pos === 6){
            spawnEnemy(3, 700, 1);
            spawnEnemy(0, 500, sc); spawnEnemy(1, 850, sc);
        } else if (pos === 13){
            spawnEnemy(4, 700, 1);
            spawnEnemy(1, 500, sc); spawnEnemy(1, 850, sc);
        } else if (pos === 20){
            spawnEnemy(5, 750, 1);
            spawnEnemy(1, 500, sc); spawnEnemy(1, 850, sc); spawnEnemy(1, 980, sc);
        } else {
            n = Math.min(3 + Math.floor(pos/5), 6);
            for (i=0;i<n;i++) spawnEnemy(i%3===0?0:1, 500 + i*140, sc);
        }
    } else {
        if (pos === 6){
            spawnEnemy(6, 600, 1);
            spawnEnemy(7, 850, 1);
        } else if (pos === 13){
            spawnEnemy(8, 700, 1);
        } else {
            n = Math.min(3 + Math.floor(pos/4), 6);
            for (i=0;i<n;i++) spawnEnemy(i%4===0?0:1, 500 + i*140, sc);
        }
    }

    levelCleared = false;
    levelClearTimer = 0;
}

function enterStage(stage){
    resetPlayerForStage();
    camX = 0;
    dashId = 0;
    currentStage = stage;
    initLevel(STAGE_BASE[stage]);
    state = ST_PLAY;
    screenDelay = 10;
}

function damageEnemy(e, dmg, dir, kb){
    if (!e.alive) return;
    var final = dmg, crit = false;
    if (player.critChance > 0 && Math.random()*100 < player.critChance){
        final *= 2; crit = true;
    }
    final = Math.max(1, Math.round(final));
    e.hp -= final;
    e.hurtTimer = crit ? 16 : 10;
    e.vx = dir * kb * (crit ? 1.3 : 1);

    if (player.lifesteal > 0){
        var heal = Math.max(1, Math.round(final * player.lifesteal / 100));
        player.hp = Math.min(player.hp + heal, player.maxhp);
    }
    if (e.hp <= 0){
        e.hp = 0; e.alive = false;
        player.score += e.boss ? 1500 : (e.type === 1 ? 300 : 100);
        player.mp = Math.min(player.mp + 12, player.maxmp);
    }
}

function playerAttack(){
    if (player.charType === CHAR_WUKONG) attackWukong();
    else if (player.charType === CHAR_SHA) attackSha();
    else attackBajie();
}

function attackWukong(){
    if (player.comboTimer > 0 && player.comboStep >= 1 && player.comboStep < 3) player.comboStep++;
    else player.comboStep = 1;

    var base, range, kb, anim, cd;
    if (player.comboStep === 1)      { base=14; range=90;  kb=2;   anim=8;  cd=12; }
    else if (player.comboStep === 2) { base=24; range=110; kb=3;   anim=10; cd=14; }
    else                             { base=46; range=140; kb=6.5; anim=16; cd=22; }

    player.atkCd = Math.max(2, Math.round(cd * player.cdMul * player.atkSpdMul));
    player.atkAnim = anim;
    player.comboTimer = 30;

    var dmg = Math.round((base + player.atkBonus) * player.dmgMul);
    for (var i=0;i<enemies.length;i++){
        var e = enemies[i];
        if (!e.alive) continue;
        var dx = e.x - player.x, dy = e.y - player.y;
        if (Math.abs(dy) > 120) continue;
        if (Math.abs(dx) > 0.5 && dx * player.facing < 0) continue;
        if (Math.abs(dx) > range) continue;
        damageEnemy(e, dmg, player.facing, kb);
    }
}

function attackSha(){
    if (player.comboTimer > 0 && player.comboStep >= 1 && player.comboStep < 3) player.comboStep++;
    else player.comboStep = 1;

    var dmg, anim, cd, num = 1;
    if (player.comboStep === 1)      { dmg=12; anim=7;  cd=11; }
    else if (player.comboStep === 2) { dmg=20; anim=9;  cd=12; }
    else                             { dmg=30; anim=12; cd=18; num=2; }

    player.atkCd = Math.max(2, Math.round(cd * player.cdMul * player.atkSpdMul));
    player.atkAnim = anim;
    player.comboTimer = 30;

    var total = Math.max(1, Math.round((dmg + player.atkBonus) * player.dmgMul * player.projMul));
    for (var k=0;k<num;k++){
        var dy = k === 0 ? 0 : (k === 1 ? -1.5 : 1.5);
        spawnProj(player.x + player.facing*30, player.y - 40 + dy*4,
                  player.facing * 11, dy,
                  total, 0, player.pierceBonus, '#44ff88', 'arrow');
    }
}

function attackBajie(){
    if (player.comboTimer > 0 && player.comboStep >= 1 && player.comboStep < 3) player.comboStep++;
    else player.comboStep = 1;

    var base, range, kb, anim, cd, spin = false;
    if (player.comboStep === 1)      { base=18; range=90;  kb=2.5; anim=10; cd=16; }
    else if (player.comboStep === 2) { base=30; range=110; kb=3.5; anim=12; cd=18; }
    else                             { base=55; range=180; kb=8;   anim=22; cd=30; spin = true; }

    player.atkCd = Math.max(2, Math.round(cd * player.cdMul * player.atkSpdMul));
    player.atkAnim = anim;
    player.comboTimer = 32;

    var dmg = Math.round((base + player.atkBonus) * player.dmgMul);
    for (var i=0;i<enemies.length;i++){
        var e = enemies[i];
        if (!e.alive) continue;
        var dx = e.x - player.x, dy = e.y - player.y;
        if (Math.abs(dy) > 120) continue;
        if (spin){
            if (Math.abs(dx) > range) continue;
        } else {
            if (Math.abs(dx) > 0.5 && dx * player.facing < 0) continue;
            if (Math.abs(dx) > range) continue;
        }
        damageEnemy(e, dmg, dx > 0 ? 1 : -1, kb);
    }
}

function skillK(){
    player.mp -= 20;
    player.skillCd = Math.max(6, Math.round(20 * player.cdMul));

    if (player.charType === CHAR_WUKONG){
        var dmg = Math.max(1, Math.round((22 + player.atkBonus) * player.dmgMul * player.projMul));
        for (var k=-1;k<=1;k++){
            spawnProj(player.x + player.facing*30, player.y - 40,
                      player.facing * 8, k * 1.5,
                      dmg, 0, player.pierceBonus, '#ff8020', 'fire');
        }
    } else if (player.charType === CHAR_SHA){
        var d2 = Math.max(1, Math.round((22 + player.atkBonus) * player.dmgMul * player.projMul));
        spawnProj(player.x + player.facing*30, player.y - 40, player.facing*12, 0, d2, 0, player.pierceBonus, '#44ff88', 'arrow');
        spawnProj(player.x + player.facing*30, player.y - 40, player.facing*11, -2.5, d2, 0, player.pierceBonus, '#44ff88', 'arrow');
        spawnProj(player.x + player.facing*30, player.y - 40, player.facing*11, 2.5, d2, 0, player.pierceBonus, '#44ff88', 'arrow');
    } else {
        var d3 = Math.max(1, Math.round((40 + player.atkBonus) * player.dmgMul * player.projMul));
        spawnProj(player.x + player.facing*30, player.y - 40,
                  player.facing*10, 0,
                  d3, 0, 0, '#ffc060', 'rake',
                  { boomerang:true, r:12 });
    }
}

function skillU(){
    player.mp -= 25;
    player.skillUCD = Math.max(15, Math.round(45 * player.cdMul));
    player.dashTimer = 14;
    player.atkAnim = 0;
    dashId++;

    if (player.charType === CHAR_WUKONG){
        player.dashVx = player.facing * 12;
        player.invulnTimer = 14;
    } else if (player.charType === CHAR_SHA){
        player.dashVx = -player.facing * 13;
        player.invulnTimer = 18;
        var dmg = Math.max(1, Math.round((28 + player.atkBonus) * player.dmgMul * player.projMul));
        for (var k=-1;k<=1;k++){
            spawnProj(player.x + player.facing*30, player.y - 40,
                      player.facing*12, k*2,
                      dmg, 0, player.pierceBonus, '#44ff88', 'arrow');
        }
    } else {
        player.dashTimer = 22;
        player.dashVx = player.facing * 12;
    }
}

function skillI(){
    if (player.charType === CHAR_SHA) return;

    player.mp -= 50;
    player.skillIFlash = 26;
    player.invulnTimer = 26;

    var dmg, range, cd, stun;
    if (player.charType === CHAR_WUKONG){
        dmg = Math.round((80 + player.atkBonus) * player.dmgMul);
        range = 220; cd = 80; stun = 50;
    } else {
        dmg = Math.round((90 + player.atkBonus) * player.dmgMul);
        range = 260; cd = 100; stun = 75;
    }
    player.skillICD = Math.max(22, Math.round(cd * player.cdMul));

    for (var i=0;i<enemies.length;i++){
        var e = enemies[i];
        if (!e.alive) continue;
        var dx = e.x - player.x;
        if (Math.abs(dx) < range && Math.abs(e.y - player.y) < 120){
            damageEnemy(e, dmg, dx > 0 ? 1 : -1, 6);
            e.stunTimer = stun;
        }
    }
}

function updateEnemies(){
    for (var i=0;i<enemies.length;i++){
        var e = enemies[i];
        if (!e.alive) continue;

        if (e.hurtTimer > 0) e.hurtTimer--;
        if (e.atkCd > 0) e.atkCd--;
        if (e.atkAnim > 0) e.atkAnim--;
        if (e.stunTimer > 0) e.stunTimer--;

        e.x += e.vx;
        e.vx *= 0.85;
        if (Math.abs(e.vx) < 0.05) e.vx = 0;

        if (e.type === 8 && !e.phase2Triggered && e.hp > 0 && e.hp <= e.maxhp/2){
            e.phase2Triggered = true;
            e.phase = 1;
            e.maxhp *= 2;
            e.hp = e.maxhp;
            e.barrageCd = 25;
            e.hurtTimer = 40;
            e.stunTimer = 0;
        }

        if (e.stunTimer > 0 || e.hurtTimer > 0){
            e.x = Math.max(20, Math.min(e.x, WORLD_W - 20));
            continue;
        }

        if (e.boss){
            e.barrageCd--;
            if (e.barrageCd <= 0){
                enemyBarrage(e);
                var baseCd = 100;
                if (e.type === 2) baseCd = 130;
                else if (e.type === 3) baseCd = 90;
                else if (e.type === 4) baseCd = 85;
                else if (e.type === 5) baseCd = 100;
                else if (e.type === 6) baseCd = 75;
                else if (e.type === 7) baseCd = 75;
                else if (e.type === 8) baseCd = e.phase === 0 ? 90 : 55;
                e.barrageCd = baseCd + Math.floor(Math.random()*30);
            }
        }

        var dx = player.x - e.x;
        var adx = Math.abs(dx);

        if (adx > 80){
            e.facing = dx > 0 ? 1 : -1;
            e.x += e.facing * e.speed;
        } else {
            e.facing = dx > 0 ? 1 : -1;
            if (e.atkCd <= 0 && Math.abs(e.y - player.y) < 100){
                e.atkCd = e.boss ? 38 : 58;
                e.atkAnim = 10;
                if (player.hurtTimer <= 0 && player.invulnTimer <= 0){
                    var dm = Math.max(1, Math.round(e.dmg * player.dmgReduce));
                    if (player.charType === CHAR_BAJIE && player.dashTimer > 0) dm = Math.floor(dm/2);
                    player.hp -= dm;
                    player.hurtTimer = 28;
                    player.kbvx = e.facing * 4;
                }
            }
        }
        e.x = Math.max(20, Math.min(e.x, WORLD_W - 20));
    }
}

function enemyBarrage(e){
    var dmg = Math.max(1, Math.round(e.dmg * 0.7));
    var i;
    switch(e.type){
        case 2:
            spawnProj(e.x, e.y - 50, e.facing * 7, 0, dmg, 1, 0, '#c060e0', 'bone', {r:8});
            break;
        case 3:
            for (i=-1;i<=1;i++) spawnProj(e.x, e.y - 50, i*3, 0, dmg, 1, 0, '#ff5020', 'fire');
            break;
        case 4:
            for (i=-2;i<=2;i++) spawnProj(e.x, e.y - 50, i*2.2, -0.8 + i*0.3, dmg, 1, 0, '#30d0e0', 'wind');
            break;
        case 5:
            for (i=0;i<8;i++){
                var a = i * Math.PI / 4;
                spawnProj(e.x, e.y - 60, Math.cos(a)*5.5, Math.sin(a)*4, dmg, 1, 0, '#e040a0', 'orb', {r:9});
            }
            break;
        case 6:
            spawnProj(e.x, e.y - 60, e.facing*8, -1.5, dmg, 1, 0, '#ffd030', 'orb');
            spawnProj(e.x, e.y - 60, e.facing*8,  1.5, dmg, 1, 0, '#ffd030', 'orb');
            break;
        case 7:
            for (i=-2;i<=2;i++) spawnProj(e.x, e.y - 60, i*2.2, i*0.4, dmg, 1, 0, '#c0c0d0', 'star');
            break;
        case 8:
            if (e.phase === 0){
                if (e.barragePattern === 0){
                    spawnProj(e.x, e.y - 60, e.facing*7, 0, dmg, 1, 0, '#9040e0', 'orb', {r:10});
                } else {
                    for (i=-1;i<=1;i++) spawnProj(e.x, e.y - 60, i*3, 0, dmg, 1, 0, '#9040e0', 'orb');
                }
                e.barragePattern = 1 - e.barragePattern;
            } else {
                var pat = e.barragePattern % 3;
                if (pat === 0){
                    for (i=0;i<10;i++){
                        var a2 = i * Math.PI / 5;
                        spawnProj(e.x, e.y - 60, Math.cos(a2)*6, Math.sin(a2)*4.5, dmg, 1, 0, '#e04020', 'orb', {r:10});
                    }
                } else if (pat === 1){
                    for (i=-2;i<=2;i++) spawnProj(e.x, e.y - 60, i*2.4, i*0.5, dmg, 1, 0, '#ff2040', 'star');
                } else {
                    spawnProj(e.x, e.y - 60, e.facing*10, 0, dmg, 1, 0, '#e04020', 'beam', {r:8});
                    spawnProj(e.x, e.y - 90, e.facing*10, 0, dmg, 1, 0, '#e04020', 'beam', {r:8});
                }
                e.barragePattern++;
            }
            break;
    }
}

function updateProjectiles(){
    for (var i = projectiles.length - 1; i >= 0; i--){
        var p = projectiles[i];

        if (p.boomerang){
            if (!p.returning){
                if (Math.abs(p.x - p.ox) > 280){
                    p.returning = true;
                    for (var j=0;j<enemies.length;j++) enemies[j].lastProjHit = 0;
                }
            } else {
                var dx = player.x - p.x;
                var dy = (player.y - 40) - p.y;
                var dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 30){ projectiles.splice(i,1); continue; }
                p.vx = dx/dist * 13;
                p.vy = dy/dist * 13;
            }
        }

        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        if (p.life <= 0 || p.x < -50 || p.x > WORLD_W + 50 || p.y < -50 || p.y > H + 50){
            projectiles.splice(i,1);
            continue;
        }

        if (p.owner === 0){
            var hit = false;
            for (var k=0;k<enemies.length;k++){
                var e = enemies[k];
                if (!e.alive) continue;
                if (e.lastProjHit === p.id) continue;
                // ★ 修复：放宽碰撞盒，保证小妖也能被打中
                var eCenterY = e.y - e.size * 0.55;
                var xTol = Math.max(e.size * 0.9, 30);
                var yTol = Math.max(e.size * 1.3, 40);
                if (Math.abs(e.x - p.x) < xTol &&
                    Math.abs(eCenterY - p.y) < yTol){
                    e.lastProjHit = p.id;
                    damageEnemy(e, p.dmg, p.vx > 0 ? 1 : -1, 3);
                    if (p.pierce > 0) p.pierce--;
                    else if (!p.boomerang){ hit = true; break; }
                }
            }
            if (hit){ projectiles.splice(i,1); continue; }
        } else {
            if (player.hurtTimer <= 0 && player.invulnTimer <= 0){
                if (Math.abs(player.x - p.x) < 30 &&
                    Math.abs((player.y - 40) - p.y) < 50){
                    var dm = Math.max(1, Math.round(p.dmg * player.dmgReduce));
                    if (player.charType === CHAR_BAJIE && player.dashTimer > 0) dm = Math.floor(dm/2);
                    player.hp -= dm;
                    player.hurtTimer = 24;
                    player.kbvx = p.vx > 0 ? 4 : -4;
                    projectiles.splice(i,1);
                    continue;
                }
            }
        }
    }
}

function updatePlayer(){
    if (!player) return;

    if (player.hurtTimer > 0) player.hurtTimer--;
    if (player.atkCd > 0) player.atkCd--;
    if (player.atkAnim > 0) player.atkAnim--;
    if (player.skillCd > 0) player.skillCd--;
    if (player.skillUCD > 0) player.skillUCD--;
    if (player.skillICD > 0) player.skillICD--;
    if (player.invulnTimer > 0) player.invulnTimer--;
    if (player.skillIFlash > 0) player.skillIFlash--;
    if (player.chargeFlash > 0) player.chargeFlash--;

    if (player.comboTimer > 0){
        player.comboTimer--;
        if (player.comboTimer === 0) player.comboStep = 0;
    }

    var mpi = player.mpRegen > 0 ? player.mpRegen : 22;
    if (frame % mpi === 0 && player.mp < player.maxmp) player.mp++;
    if (player.hpRegen > 0 && frame % player.hpRegen === 0 && player.hp > 0 && player.hp < player.maxhp) player.hp++;

    if (player.charType === CHAR_SHA){
        if (player.chargeTimer > 0){
            if (!down('KeyI')){
                if (player.chargeTimer >= 30){
                    var dmg2 = Math.max(1, Math.round((60 + player.atkBonus) * player.dmgMul * player.projMul));
                    spawnProj(player.x + player.facing*30, player.y - 40,
                              player.facing*14, 0, dmg2, 0, 3 + player.pierceBonus, '#a0ff60', 'arrow');
                }
                player.chargeTimer = 0;
            } else {
                player.chargeTimer++;
                if (player.chargeTimer >= 60){
                    var dmg3 = Math.max(1, Math.round((130 + player.atkBonus) * player.dmgMul * player.projMul));
                    player.mp -= 50;
                    player.skillICD = Math.max(20, Math.round(60 * player.cdMul));
                    player.chargeTimer = 0;
                    player.chargeFlash = 14;
                    player.invulnTimer = 8;
                    spawnProj(player.x + player.facing*40, player.y - 40,
                              player.facing*18, 0,
                              dmg3, 0, 12 + player.pierceBonus, '#ffff40', 'bigarrow', {r:16});
                }
            }
        } else {
            if (edge('KeyI') && player.mp >= 50 && player.skillICD <= 0){
                player.chargeTimer = 1;
            }
        }
    }

    var canMove = player.atkAnim === 0 && player.dashTimer === 0 && player.chargeTimer === 0;

    if (edge('KeyU') && player.skillUCD <= 0 && player.mp >= 25 && player.dashTimer === 0){
        skillU();
    }

    if (player.charType !== CHAR_SHA){
        if (edge('KeyI') && player.skillICD <= 0 && player.mp >= 50){
            skillI();
        }
    }

    var mv = 0;
    if (player.dashTimer > 0){
        player.dashTimer--;
        player.x += player.dashVx;
        player.dashVx *= 0.9;

        if (player.charType !== CHAR_SHA){
            for (var i=0;i<enemies.length;i++){
                var e = enemies[i];
                if (!e.alive || e.lastDashHit === dashId) continue;
                if (Math.abs(e.x - player.x) < 50 && Math.abs(e.y - player.y) < 100){
                    e.lastDashHit = dashId;
                    var dm = Math.round((32 + player.atkBonus) * player.dmgMul);
                    damageEnemy(e, dm, player.facing, 5);
                    if (player.charType === CHAR_WUKONG) e.stunTimer = 32;
                    if (player.charType === CHAR_BAJIE) e.vx = player.facing * 12;
                }
            }
        }
    } else {
        if (canMove){
            if (anyDown('KeyA','ArrowLeft'))  { mv -= 1; player.facing = -1; }
            if (anyDown('KeyD','ArrowRight')) { mv += 1; player.facing = 1; }
        }
        var spd = 6 * player.moveMul;
        if (player.charType === CHAR_BAJIE) spd *= 0.85;
        if (player.chargeTimer > 0) spd *= 0.3;
        player.x += mv * spd;
    }

    if (canMove && anyEdge('KeyW','ArrowUp','Space') && player.onGround){
        player.vy = JUMP_V;
        player.onGround = false;
    }

    if (canMove && edge('KeyJ') && player.atkCd <= 0){
        playerAttack();
    }

    if (canMove && edge('KeyK') && player.skillCd <= 0 && player.mp >= 20){
        skillK();
    }

    player.vy += GRAV;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;
    player.y += player.vy;
    if (player.y >= GROUND){ player.y = GROUND; player.vy = 0; player.onGround = true; }

    player.x += player.kbvx;
    player.kbvx *= 0.85;
    if (Math.abs(player.kbvx) < 0.05) player.kbvx = 0;

    if (player.x < 30) player.x = 30;
    if (player.x > WORLD_W - 30) player.x = WORLD_W - 30;

    if (player.hp <= 0){
        player.hp = 0;
        state = ST_OVER;
        screenDelay = 20;
    }
}

function updateCamera(){
    if (!player) return;
    var target = player.x - W * 0.4;
    target = Math.max(0, Math.min(target, WORLD_W - W));
    camX += (target - camX) * 0.15;
}

function checkLevelClear(){
    var alive = 0;
    for (var i=0;i<enemies.length;i++) if (enemies[i].alive) alive++;
    if (alive === 0 && !levelCleared){
        levelCleared = true;
        levelClearTimer = 60;
    }
    if (levelCleared){
        levelClearTimer--;
        if (levelClearTimer <= 0){
            var pos = level - STAGE_BASE[currentStage];
            if (pos < STAGE_LEN[currentStage] - 1){
                buffOptions = [];
                var pool = BUFFS.slice();
                for (var k=0;k<3;k++){
                    var idx = Math.floor(Math.random()*pool.length);
                    buffOptions.push(pool.splice(idx,1)[0]);
                }
                buffSel = 0;
                buffDelay = 20;
                state = ST_BUFF;
            } else {
                if (!progress.stageCleared[currentStage]){
                    if (currentStage === 0){
                        progress.bonusHP += 50; progress.bonusMP += 50; progress.bonusATK += 5;
                        progress.maxUnlocked = Math.max(progress.maxUnlocked, 1);
                    } else if (currentStage === 1){
                        progress.bonusHP += 50; progress.bonusMP += 50; progress.bonusATK += 10;
                        progress.maxUnlocked = Math.max(progress.maxUnlocked, 2);
                    }
                    progress.stageCleared[currentStage] = true;
                    saveProgress();
                }
                state = ST_STAGECLEAR;
                screenDelay = 20;
            }
        }
    }
}

function update(){
    frame++;
    if (screenDelay > 0) screenDelay--;

    switch(state){
        case ST_TITLE:
            if (anyEdge('KeyJ','Space')){ charSel = 0; state = ST_CHARSEL; screenDelay = 10; }
            break;
        case ST_CHARSEL:
            if (screenDelay > 0) break;
            if (anyEdge('KeyA','ArrowLeft') && charSel > 0) charSel--;
            if (anyEdge('KeyD','ArrowRight') && charSel < 2) charSel++;
            if (anyEdge('KeyJ','Space')){
                selectedChar = charSel;
                stageSel = 0;
                state = ST_STAGESEL;
                screenDelay = 10;
            }
            break;
        case ST_STAGESEL:
            if (screenDelay > 0) break;
            if (anyEdge('KeyA','ArrowLeft') && stageSel > 0) stageSel--;
            if (anyEdge('KeyD','ArrowRight') && stageSel < 2) stageSel++;
            if (anyEdge('KeyJ','Space')){
                if (stageSel <= progress.maxUnlocked) enterStage(stageSel);
            }
            break;
        case ST_PLAY:
            updatePlayer();
            updateEnemies();
            updateProjectiles();
            updateCamera();
            checkLevelClear();
            break;
        case ST_BUFF:
            if (buffDelay > 0){ buffDelay--; break; }
            if (anyEdge('KeyA','ArrowLeft') && buffSel > 0) buffSel--;
            if (anyEdge('KeyD','ArrowRight') && buffSel < 2) buffSel++;
            if (anyEdge('KeyJ','Space')){
                applyBuff(buffOptions[buffSel].id);
                player.x = 100;
                player.y = GROUND;
                player.vy = 0;
                player.onGround = true;
                player.hp = Math.min(player.hp + 50, player.maxhp);
                player.mp = player.maxmp;
                player.comboStep = 0;
                player.comboTimer = 0;
                player.kbvx = 0;
                player.hurtTimer = 0;
                player.invulnTimer = 40;
                player.chargeTimer = 0;
                camX = 0;
                initLevel(level + 1);
                state = ST_PLAY;
                screenDelay = 10;
            }
            break;
        case ST_STAGECLEAR:
            if (screenDelay > 0) break;
            if (anyEdge('KeyJ','Space')){
                if (currentStage === 2 && progress.stageCleared[2]){
                    state = ST_ALLWIN;
                } else {
                    state = ST_STAGESEL;
                    stageSel = 0;
                }
                screenDelay = 10;
            }
            break;
        case ST_OVER:
            if (screenDelay > 0) break;
            if (anyEdge('KeyJ','Space')){ state = ST_TITLE; screenDelay = 10; }
            break;
        case ST_ALLWIN:
            if (screenDelay > 0) break;
            if (anyEdge('KeyJ','Space')){ state = ST_TITLE; screenDelay = 10; }
            break;
    }
}

function fillText(text, x, y, size, color, align, bold){
    ctx.font = (bold ? 'bold ' : '') + size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
}

function roundRect(x, y, w, h, r, fill, stroke, lw){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function drawSky(){
    var g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#0a0a30');
    g.addColorStop(0.5, '#1a1240');
    g.addColorStop(1, '#3a1a50');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND);

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (var i=0;i<80;i++){
        var sx = ((i*173 - camX*0.1) % W + W) % W;
        var sy = (i*47) % 220 + 15;
        var sz = (i % 5 === 0) ? 2 : 1;
        ctx.fillRect(sx, sy, sz, sz);
    }

    var mx = W - 130 - (camX*0.05) % W;
    ctx.beginPath();
    ctx.arc(mx, 90, 40, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(220,200,255,0.18)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mx, 90, 28, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(240,230,255,0.5)';
    ctx.fill();
}

function drawMountains(){
    ctx.fillStyle = '#151030';
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (var x=0;x<=W;x+=20){
        var wx = x + camX*0.3;
        var y = GROUND - 110 - Math.sin(wx*0.004)*50 - Math.sin(wx*0.013)*30;
        ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#2a1848';
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (var x2=0;x2<=W;x2+=15){
        var wx2 = x2 + camX*0.6;
        var y2 = GROUND - 60 - Math.sin(wx2*0.007)*30 - Math.sin(wx2*0.02)*20;
        ctx.lineTo(x2, y2);
    }
    ctx.lineTo(W, GROUND);
    ctx.closePath();
    ctx.fill();
}

function drawGround(){
    var g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#4a3a2a');
    g.addColorStop(1, '#1a1008');
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND, W, H - GROUND);

    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(0, GROUND, W, 4);
    ctx.fillStyle = 'rgba(255,200,100,0.4)';
    ctx.fillRect(0, GROUND, W, 1);

    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    var off = -camX % 60;
    for (var x=off-60;x<W;x+=60){
        for (var y=GROUND+20;y<H;y+=40){
            ctx.strokeRect(x, y, 60, 40);
        }
    }
}

function drawPlayer(){
    if (!player) return;
    var sx = player.x - camX;
    var sy = player.y;

    var flashing = player.hurtTimer > 0 && Math.floor(frame/2) % 2 === 0;
    var invuln = player.invulnTimer > 0;

    if (player.chargeTimer > 0){
        var r = 20 + player.chargeTimer * 0.6;
        var alpha = 0.15 + player.chargeTimer / 100;
        var col = player.chargeTimer >= 55 ? '#ff4040' : '#40d0ff';
        ctx.beginPath();
        ctx.arc(sx, sy - 45, r, 0, Math.PI*2);
        ctx.strokeStyle = col;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    if (player.dashTimer > 0){
        for (var i=1;i<=3;i++){
            var gx = sx - player.dashVx * i * 0.9;
            ctx.globalAlpha = 0.3 / i;
            ctx.beginPath();
            ctx.arc(gx, sy - 45, 20, 0, Math.PI*2);
            ctx.fillStyle = '#40d0ff';
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    if (invuln && Math.floor(frame/3) % 2 === 0) ctx.globalAlpha = 0.6;
    if (flashing) ctx.globalAlpha = 0.5;

    var bodyColor, headColor;
    if (player.charType === CHAR_WUKONG){
        bodyColor = '#ffd040'; headColor = '#ffe080';
    } else if (player.charType === CHAR_SHA){
        bodyColor = '#40c860'; headColor = '#60e880';
    } else {
        bodyColor = '#e09040'; headColor = '#ffb060';
    }

    ctx.beginPath();
    ctx.ellipse(sx, GROUND + 3, 22, 6, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();

    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.ellipse(sx, sy - 40, 16, 22, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sx, sy - 72, 16, 0, Math.PI*2);
    ctx.fillStyle = headColor;
    ctx.fill();

    var eyeOff = player.facing * 5;
    ctx.beginPath();
    ctx.arc(sx - 4 + eyeOff, sy - 74, 2.5, 0, Math.PI*2);
    ctx.arc(sx + 4 + eyeOff, sy - 74, 2.5, 0, Math.PI*2);
    ctx.fillStyle = '#000';
    ctx.fill();

    if (player.charType === CHAR_WUKONG){
        ctx.beginPath();
        ctx.arc(sx, sy - 72, 16, Math.PI*1.1, Math.PI*1.9);
        ctx.strokeStyle = '#ff4040';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.save();
        ctx.translate(sx, sy - 45);
        ctx.rotate(player.facing * 0.3);
        ctx.fillStyle = '#c8a020';
        ctx.fillRect(player.facing > 0 ? 12 : -52, -3, 40, 6);
        ctx.fillStyle = '#ffe060';
        ctx.fillRect(player.facing > 0 ? 12 : -52, -3, 40, 2);
        ctx.restore();
    } else if (player.charType === CHAR_SHA){
        ctx.beginPath();
        ctx.arc(sx + player.facing*20, sy - 45, 20,
                -Math.PI/2 + (player.facing>0?0:Math.PI),
                 Math.PI/2 + (player.facing>0?0:Math.PI),
                false);
        ctx.strokeStyle = '#a0ff60';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx + player.facing*20, sy - 65);
        ctx.lineTo(sx + player.facing*20, sy - 25);
        ctx.strokeStyle = 'rgba(200,255,180,0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
    } else {
        ctx.save();
        ctx.translate(sx + player.facing*16, sy - 45);
        ctx.rotate(player.facing * 0.5);
        ctx.fillStyle = '#c08040';
        ctx.fillRect(-2, -30, 4, 60);
        ctx.fillStyle = '#e0c060';
        for (var k=0;k<3;k++){
            ctx.fillRect(-2 + (k-1)*6, -32, 2, 8);
        }
        ctx.restore();
    }

    if (player.atkAnim > 0){
        var d = player.facing;
        var step = player.comboStep;
        ctx.globalAlpha = player.atkAnim / 20 + 0.3;

        if (player.charType === CHAR_WUKONG){
            ctx.strokeStyle = step >= 3 ? '#ff8020' : '#ffffff';
            ctx.lineWidth = step >= 3 ? 5 : 3;
            ctx.beginPath();
            var r = step === 1 ? 50 : (step === 2 ? 70 : 110);
            ctx.arc(sx, sy - 45, r, 
                d > 0 ? -Math.PI/3 : Math.PI - Math.PI/3,
                d > 0 ? Math.PI/3 : Math.PI + Math.PI/3);
            ctx.stroke();
        } else if (player.charType === CHAR_BAJIE){
            if (step >= 3){
                ctx.strokeStyle = '#ffc060';
                ctx.lineWidth = 6;
                var ang = (frame * 0.6) % (Math.PI*2);
                ctx.beginPath();
                ctx.arc(sx, sy - 45, 100, ang, ang + Math.PI*1.3);
                ctx.stroke();
            } else {
                ctx.strokeStyle = '#e0c060';
                ctx.lineWidth = 4;
                ctx.beginPath();
                var r2 = step === 1 ? 55 : 75;
                ctx.arc(sx, sy - 45, r2,
                    d > 0 ? -Math.PI/3 : Math.PI - Math.PI/3,
                    d > 0 ? Math.PI/3 : Math.PI + Math.PI/3);
                ctx.stroke();
            }
        }
        ctx.globalAlpha = 1;
    }

    if (player.skillIFlash > 0){
        var t = 26 - player.skillIFlash;
        var rr = t * 12;
        ctx.beginPath();
        ctx.arc(sx, sy - 45, rr, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,220,100,' + (player.skillIFlash/26) + ')';
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(sx, sy - 45, rr * 0.7, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,120,60,' + (player.skillIFlash/26) + ')';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    if (player.chargeFlash > 0){
        ctx.globalAlpha = player.chargeFlash / 14;
        ctx.fillStyle = '#ffff80';
        ctx.beginPath();
        ctx.arc(sx + player.facing*40, sy - 45, 30, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    ctx.globalAlpha = 1;
}

function drawEnemy(e){
    var sx = e.x - camX;
    var sy = e.y;
    var flashing = e.hurtTimer > 0 && Math.floor(frame/2) % 2 === 0;
    var stunned = e.stunTimer > 0;

    ctx.beginPath();
    ctx.ellipse(sx, GROUND + 3, e.size*0.7, e.size*0.2, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();

    var col = e.color;
    if (e.type === 8 && e.phase === 1) col = '#ff3020';

    if (flashing) ctx.globalAlpha = 0.5;

    ctx.fillStyle = col;
    if (e.boss){
        ctx.beginPath();
        ctx.ellipse(sx, sy - e.size*0.6, e.size*0.55, e.size*0.75, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx, sy - e.size*1.35, e.size*0.45, 0, Math.PI*2);
        ctx.fill();

        var glowR = e.size + 8 + Math.sin(frame*0.1) * 4;
        ctx.beginPath();
        ctx.arc(sx, sy - e.size*0.7, glowR, 0, Math.PI*2);
        ctx.strokeStyle = col;
        ctx.globalAlpha = 0.3;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = flashing ? 0.5 : 1;

        var eo = e.facing * e.size*0.15;
        ctx.beginPath();
        ctx.arc(sx - e.size*0.15 + eo, sy - e.size*1.4, 3, 0, Math.PI*2);
        ctx.arc(sx + e.size*0.15 + eo, sy - e.size*1.4, 3, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    } else {
        ctx.beginPath();
        ctx.ellipse(sx, sy - e.size*0.5, e.size*0.5, e.size*0.6, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx, sy - e.size*1.1, e.size*0.4, 0, Math.PI*2);
        ctx.fill();
    }

    if (stunned){
        ctx.fillStyle = '#ffe040';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        var t = frame * 0.15;
        for (var i=0;i<2;i++){
            var ang2 = t + i * Math.PI;
            ctx.fillText('★', sx + Math.cos(ang2)*20, sy - e.size*2 + Math.sin(ang2)*5);
        }
    }

    ctx.globalAlpha = 1;

    var barW = e.boss ? e.size * 1.6 : e.size;
    var barH = e.boss ? 6 : 4;
    var barY = sy - e.size * (e.boss ? 2.4 : 1.9);
    var barX = sx - barW / 2;
    roundRect(barX, barY, barW, barH, 2, 'rgba(0,0,0,0.7)', null);
    var fillW = barW * (e.hp / e.maxhp);
    var hpCol = e.hp / e.maxhp > 0.5 ? '#40e040' : (e.hp / e.maxhp > 0.25 ? '#e0e040' : '#e04040');
    roundRect(barX, barY, fillW, barH, 2, hpCol, null);

    if (e.type === 8 && e.phase === 1){
        fillText('PHASE 2', sx, barY - 12, 12, '#ff4040', 'center', true);
    }
}

function drawProjectile(p){
    var sx = p.x - camX;
    var sy = p.y;

    ctx.save();
    ctx.translate(sx, sy);

    var r = p.r;

    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.6, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.globalAlpha = 1;

    if (p.shape === 'fire'){
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI*2);
        ctx.fillStyle = '#ff6020';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.6, 0, Math.PI*2);
        ctx.fillStyle = '#ffd060';
        ctx.fill();
    } else if (p.shape === 'arrow'){
        var ang = Math.atan2(p.vy, p.vx);
        ctx.rotate(ang);
        ctx.fillStyle = p.color;
        ctx.fillRect(-12, -2, 20, 4);
        ctx.beginPath();
        ctx.moveTo(8, -5);
        ctx.lineTo(14, 0);
        ctx.lineTo(8, 5);
        ctx.fillStyle = '#c0ffc0';
        ctx.fill();
    } else if (p.shape === 'bigarrow'){
        var ang2 = Math.atan2(p.vy, p.vx);
        ctx.rotate(ang2);
        ctx.fillStyle = '#ffff60';
        ctx.fillRect(-25, -5, 45, 10);
        ctx.beginPath();
        ctx.moveTo(20, -12);
        ctx.lineTo(35, 0);
        ctx.lineTo(20, 12);
        ctx.fillStyle = '#ffc040';
        ctx.fill();
        ctx.globalAlpha = 0.4;
        for (var i=0;i<5;i++){
            ctx.fillRect(-25 - i*8, -3, 8, 6);
        }
        ctx.globalAlpha = 1;
    } else if (p.shape === 'rake'){
        ctx.rotate(frame * 0.4);
        ctx.fillStyle = '#c08040';
        ctx.fillRect(-2, -16, 4, 32);
        ctx.fillStyle = '#e0c060';
        for (var k=0;k<4;k++){
            ctx.fillRect(-10 + k*5, -20, 3, 8);
        }
    } else if (p.shape === 'orb'){
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-r*0.3, -r*0.3, r*0.5, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fill();
    } else if (p.shape === 'star'){
        ctx.rotate(frame * 0.2);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        for (var s=0;s<5;s++){
            var a1 = s * Math.PI * 2 / 5 - Math.PI/2;
            var a2 = a1 + Math.PI / 5;
            ctx.lineTo(Math.cos(a1)*r*1.3, Math.sin(a1)*r*1.3);
            ctx.lineTo(Math.cos(a2)*r*0.6, Math.sin(a2)*r*0.6);
        }
        ctx.closePath();
        ctx.fill();
    } else if (p.shape === 'beam'){
        var ang3 = Math.atan2(p.vy, p.vx);
        ctx.rotate(ang3);
        ctx.fillStyle = p.color;
        ctx.fillRect(-25, -r/2, 50, r);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(-25, -r/4, 50, r/2);
    } else if (p.shape === 'bone'){
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillStyle = '#e0d0f0';
        ctx.beginPath();
        ctx.arc(-8, 0, 5, 0, Math.PI*2);
        ctx.arc(8, 0, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillRect(-8, -2, 16, 4);
    } else if (p.shape === 'wind'){
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (var w=0;w<3;w++){
            ctx.moveTo(-12 + w*8, -4 + w*2);
            ctx.lineTo(-4 + w*8, 4 - w*2);
        }
        ctx.stroke();
    } else {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.fill();
    }

    ctx.restore();
}

function drawBar(x, y, w, h, cur, max, color, label){
    fillText(label, x, y + h/2, 14, '#fff', 'left', true);
    var bx = x + 30;
    roundRect(bx, y, w, h, 3, 'rgba(0,0,0,0.7)', 'rgba(255,255,255,0.3)', 1);
    var fillW = Math.max(0, Math.min(w * (cur / max), w));
    roundRect(bx, y, fillW, h, 3, color, null);
    fillText(Math.round(cur) + ' / ' + max, bx + w + 8, y + h/2, 12, '#aaa', 'left');
}

function drawHUD(){
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, 70);

    drawBar(15, 10, 180, 16, player.hp, player.maxhp, '#e04040', 'HP');
    drawBar(15, 36, 180, 16, player.mp, player.maxmp, '#4060e0', 'MP');

    var sx = 320;
    var skillInfo = [
        { key:'K', name: player.charType===CHAR_WUKONG?'三连火球':(player.charType===CHAR_SHA?'三连射':'回旋钉耙'), cd: player.skillCd, max: 20, color:'#ff8020' },
        { key:'U', name: player.charType===CHAR_WUKONG?'云冲刺':(player.charType===CHAR_SHA?'后跳箭':'野猪冲'), cd: player.skillUCD, max: 45, color:'#40c0ff' },
        { key:'I', name: player.charType===CHAR_WUKONG?'大闹天宫':(player.charType===CHAR_SHA?'蓄力巨箭':'地动山摇'), cd: player.skillICD, max: 80, color:'#ff40a0' }
    ];

    for (var i=0;i<3;i++){
        var s = skillInfo[i];
        var ready = s.cd <= 0;
        var alpha = ready ? 1 : 0.4;

        ctx.globalAlpha = alpha;
        roundRect(sx, 12, 130, 46, 6,
            ready ? 'rgba(60,40,100,0.9)' : 'rgba(40,40,50,0.9)',
            ready ? s.color : '#666', 2);

        fillText('[' + s.key + ']', sx + 10, 24, 14, ready ? s.color : '#888', 'left', true);
        fillText(s.name, sx + 10, 44, 13, ready ? '#fff' : '#888', 'left');

        if (!ready){
            var pct = 1 - s.cd / s.max;
            roundRect(sx + 2, 54, (126) * pct, 3, 2, s.color, null);
        }
        ctx.globalAlpha = 1;

        sx += 145;
    }

    var pos = level - STAGE_BASE[currentStage];
    fillText('第 ' + (currentStage+1) + ' 章 · ' + (pos+1) + '/' + STAGE_LEN[currentStage],
             W - 20, 20, 14, '#ffe080', 'right', true);
    fillText('分数 ' + player.score, W - 20, 44, 14, '#fff', 'right');
    fillText('增益 x' + player.buffCount, W - 130, 44, 14, '#c080ff', 'right');

    if (player.comboStep > 0 && player.comboTimer > 0){
        var alpha2 = player.comboTimer / 30;
        ctx.globalAlpha = alpha2;
        fillText('COMBO x' + player.comboStep, 15, 88, 20, '#ffe040', 'left', true);
        ctx.globalAlpha = 1;
    }

    if (player.critChance > 0){
        fillText('暴击 ' + player.critChance + '%', 15, 115, 13, '#ff80ff', 'left');
    }

    if (player.charType === CHAR_SHA && player.chargeTimer > 0){
        var pct2 = player.chargeTimer / 60;
        var cx = W/2 - 100;
        roundRect(cx, 90, 200, 16, 6, 'rgba(0,0,0,0.7)', '#40ff80', 2);
        roundRect(cx+2, 92, 196*pct2, 12, 4,
            pct2 >= 0.95 ? '#ff4040' : '#40ff80', null);
        fillText('蓄力 ' + Math.floor(pct2*100) + '%', W/2, 98, 12, '#000', 'center', true);
    }

    if (levelCleared && levelClearTimer > 0){
        var a3 = Math.min(1, levelClearTimer / 30);
        ctx.globalAlpha = a3;
        fillText('关卡完成!', W/2, H/2 - 50, 48, '#ffe040', 'center', true);
        ctx.globalAlpha = 1;
    }
}

    drawPlayer();
    drawHUD();

    ctx.restore();

    fillText('第 ' + (currentStage+1) + ' 章 已通关', W/2, 210, 26, '#80ff80', 'center', true);

    var rewards = [];
    if (currentStage === 0){
        rewards = ['最大生命 +50', '最大法力 +50', '攻击力 +5'];
    } else if (currentStage === 1){
        rewards = ['最大生命 +50', '最大法力 +50', '攻击力 +10'];
    } else {
        rewards = ['你已经征服了一切', '取经之路圆满结束'];
    }

    fillText('永久奖励:', W/2, 270, 22, '#c0a0ff', 'center', true);
    for (var i=0;i<rewards.length;i++){
        fillText('· ' + rewards[i], W/2, 310 + i*34, 22, '#80ff80', 'center');
    }

    if (currentStage < 2){
        if (Math.floor(frame/10) % 2 === 0){
            fillText('▶ 新章节已解锁!', W/2, 440, 24, '#ffe040', 'center', true);
        }
    }

    if (Math.floor(frame/15) % 2 === 0){
        fillText('按 J 继续', W/2, 530, 22, '#fff', 'center', true);
    }
}

function renderOver(){
    renderGame();
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.shadowColor = '#ff4040';
    ctx.shadowBlur = 30;
    fillText('GAME OVER', W/2, 160, 72, '#ff4040', 'center', true);
    ctx.restore();

    var pos = level - STAGE_BASE[currentStage];
    fillText('最终分数: ' + player.score, W/2, 260, 28, '#ffe040', 'center');
    fillText('到达: 第 ' + (currentStage+1) + ' 章 · 第 ' + (pos+1) + ' 关', W/2, 310, 22, '#c0c0ff', 'center');
    fillText('累计祝福: x' + player.buffCount, W/2, 355, 22, '#c080ff', 'center');

    if (Math.floor(frame/15) % 2 === 0){
        fillText('按 J 返回主菜单', W/2, 480, 24, '#fff', 'center', true);
    }
}

function renderAllWin(){
    drawSky();
    drawMountains();
    drawGround();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    for (var i=0;i<8;i++){
        var t = (frame * 0.02 + i * 0.5) % 3;
        var fx = (i * 137 + 100) % W;
        var fy = 150 + (i * 83) % 250;
        var r = t * 60;
        var alpha = Math.max(0, 1 - t/3);
        ctx.beginPath();
        ctx.arc(fx, fy, r, 0, Math.PI*2);
        ctx.strokeStyle = ['#ff4040','#ffe040','#40ff40','#4080ff','#ff40a0'][i % 5];
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.shadowColor = '#ffe040';
    ctx.shadowBlur = 40;
    fillText('★ 通关 ★', W/2, 130, 84, '#ffe040', 'center', true);
    ctx.restore();

    fillText('恭喜你完成了全部三大章节', W/2, 230, 28, '#80ff80', 'center', true);
    fillText('共 42 关 · 8 场 BOSS 战', W/2, 280, 22, '#c0c0ff', 'center');

    fillText('白骨精 · 红孩儿 · 铁扇公主 · 牛魔王', W/2, 340, 18, '#a0a0a0', 'center');
    fillText('金童子 · 银童子 · 镇元大仙', W/2, 370, 18, '#a0a0a0', 'center');

    fillText('最终分数: ' + player.score, W/2, 430, 28, '#ffe040', 'center', true);

    if (Math.floor(frame/15) % 2 === 0){
        fillText('按 J 返回主菜单', W/2, 530, 22, '#fff', 'center', true);
    }
}

function render(){
    ctx.clearRect(0, 0, W, H);
    switch(state){
        case ST_TITLE:      renderTitle();      break;
        case ST_CHARSEL:    renderCharSel();    break;
        case ST_STAGESEL:   renderStageSel();   break;
        case ST_PLAY:       renderGame();       break;
        case ST_BUFF:       renderBuff();       break;
        case ST_STAGECLEAR: renderStageClear(); break;
        case ST_OVER:       renderOver();       break;
        case ST_ALLWIN:     renderAllWin();     break;
    }
}

var acc = 0;
var lastTime = performance.now();

function loop(now){
    var dt = now - lastTime;
    lastTime = now;
    if (dt > 250) dt = 250;
    acc += dt;

    var safety = 0;
    while (acc >= STEP && safety < 5){
        update();
        keysPrev = Object.assign({}, keys);
        acc -= STEP;
        safety++;
    }
    if (safety >= 5) acc = 0;

    render();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

})();
</script>
</body>
</html>
